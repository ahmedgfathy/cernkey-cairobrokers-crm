{% extends "base.html" %}
{% block title %}Delete Property Status - Cairobrokers CRM{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Delete Property Status</h1>
</div>
<div class="sap-card" style="max-width:36rem;">
    <div class="sap-card-body" style="text-align:center;padding:2rem;">
        <i class="fas fa-exclamation-triangle text-warning" style="font-size:2.5rem;margin-bottom:1rem;"></i>
        <h4 style="margin-bottom:0.5rem;">Are you sure?</h4>
        <p class="text-muted mb-3">You are about to delete <strong>{{ pstatus.name }}</strong>. This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div style="display:flex;gap:0.5rem;justify-content:center;">
                <button type="submit" class="sap-btn sap-btn-danger"><i class="fas fa-trash"></i> Delete</button>
                <a href="{% url 'property_status_list' %}" class="sap-btn sap-btn-default">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
